# papermini batch config - paths are relative to this file.
#   papermini batch examples/minis.yaml
#
# Every per-figure option of `papermini make` can be used here (with
# underscores or dashes): height_mm, margin_mm, strength, fill_gaps, crop,
# keep_all, min_area, no_tab, double_sided, label, model, mask, ...
# The sheet can also be cut by machine (cut: machine, bleed_mm, marks, cut_folds).

output: minis                 # folder for the SVGs (and debug output)

sheet:
  output: minis/sheet.pdf
  paper: a4                   # or letter
  copies: 1                   # default copies per figure
  preview: true               # also write sheet.png
  title: Dragon's lair

defaults:
  height_mm: 42
  strength: 40
  fill_gaps: 9

figures:
  - image: kobold.png
    label: Kobold
    copies: 2

  - image: dragon-whelp.jpg
    label: Whelp

  - image: dragon-egg.png
    label: Egg
    height_mm: 34

  # Busy background: let the model look only at the figure's region.
  - image: boss-lair.jpg
    label: Ancient dragon
    height_mm: 56
    strength: 60
    fill_gaps: 7
    crop: [0.08, 0, 0.92, 0.62]
