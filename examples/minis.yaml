# A papermini project file - paths are relative to this file.
#   papermini build examples/minis.yaml
#
# Every figure option of `papermini add` and `papermini build` can be used here (with
# underscores or dashes): height_mm, margin_mm, strength, fill_gaps, crop,
# keep_all, min_area, no_tab, double_sided, label, model, mask, ...
# The sheet can also be cut by machine (cut: machine, bleed_mm, marks, cut_folds).

output: minis                 # folder for the SVGs (and debug output)

sheet:
  output: minis/sheet.pdf
  paper: a4                   # or letter
  copies: 1                   # default copies per figure
  preview: true               # also write sheet.png
  title: Dragon's lair

defaults:
  height_mm: 42
  strength: 40
  fill_gaps: 9

figures:
  # The image has transparency, so it needs no model.
  - image: dragons/dragon.webp
    label: Red dragon
    copies: 2

  # A busy landscape behind the figure.
  - image: dragons/dragon-flying.webp
    label: Flying dragon
    strength: 60
    fill_gaps: 7

  # A stat block: let the model look only at the figure's region.
  - image: dragons/statblock-with-dragon.webp
    label: Whelp
    height_mm: 34
    crop: [0.03, 0.15, 0.565, 0.8]
