# The dragons in the README screenshots (scripts/screenshots.py).
# Rebuild the miniatures and the sheet with:
#   papermini batch examples/dragons/dragons.yaml
# BiRefNet removes the backgrounds best here (see "Background removal models" in
# the README); it is downloaded on first use.

output: out

sheet:
  output: out/dragons-sheet.pdf
  paper: a4
  title: papermini dragons

figures:
  # a stat block: the crop keeps the dragon and leaves out the text and the ornament
  - image: statblock-with-dragon.webp
    label: Dragon whelp
    size: small
    model: birefnet
    crop: [0.03, 0.15, 0.565, 0.8]

  # a busy landscape behind the figure; printed in black with a round base. This is the
  # mini in dragon-flying-photo.jpg, under the README's first screenshot: keep its size
  # (36 mm tall on a 25 mm base) as printed there (tests/test_project_store.py checks it).
  # The tab reaches up to the claws, so it holds on to more than the tip of the tail.
  - image: dragon-flying.webp
    name: Flying dragon
    label: ""
    model: birefnet
    size: custom
    height_mm: 36
    tab_radius_mm: 12.5
    margin_color: "#000000"
    tab_shape: round
    tab_color: "#000000"
    tab_overlap_mm: 4

  # an image with a soft transparent edge
  - image: dragon.webp
    label: Red dragon
    size: huge
    model: birefnet
