[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "papermini"
dynamic = ["version"]  # from the git tag (vMAJOR.MINOR.PATCH), see [tool.setuptools_scm]
description = "Turn an illustration into a print-ready paper miniature (SVG + PDF sheet)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.22",
    "pillow>=9.0",
    "opencv-python-headless>=4.6",
    "onnxruntime>=1.14; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # 1.24 and newer have no wheels for Intel Macs
    "onnxruntime>=1.14,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "reportlab>=3.6",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "svg-py>=1.10",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.8",
    "cryptography>=42",  # signed updates
]

# Development only, not published: uv installs the dev group by default; the build
# group with `--group build` (see the justfile).
[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=6",
    "ruff==0.17.5",
    "ty==0.0.104",  # beta: a new version can report new problems
]
build = ["pyinstaller>=6.10"]  # standalone binaries, see packaging/
release = ["cryptography>=42"]  # signs the checksums of a release

[project.scripts]
papermini = "papermini.cli:main"

[project.gui-scripts]
papermini-gui = "papermini.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papermini.gui" = ["logo.svg"]
"papermini" = ["fonts/*/*.ttf", "fonts/*/OFL.txt"]  # the bundled fonts (SIL OFL)

[tool.setuptools_scm]
# Semantic versioning from git tags: tag v1.2.3 builds version 1.2.3; commits after
# a tag get a development version such as 1.2.4.dev3+g1a2b3c4.
version_file = "src/papermini/_version.py"
fallback_version = "0.0.0"

[tool.uv]
# uv rebuilds papermini when any of these change, so that its version from
# setuptools-scm stays current:
# - pyproject.toml
# - the current git commit
# - the git tags
# - SETUPTOOLS_SCM_PRETEND_VERSION
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { env = "SETUPTOOLS_SCM_PRETEND_VERSION" },
]

[tool.ruff.lint]
# Ruff's default rule set, except:
ignore = [
    "TRY004",  # invalid input from a project file raises ValueError, which the CLI and GUI catch
]

[tool.ty.environment]
extra-paths = ["scripts"]  # tests import the release scripts
python-platform = "all"  # check the code for every platform, with the same findings on each

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["papermini"]
core = "sysmon"  # also measures the threads Qt starts

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 96  # the lower of the CI and local totals, rounded down
