[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "papermini"
dynamic = ["version"]  # from the git tag (vMAJOR.MINOR.PATCH), see [tool.setuptools_scm]
description = "Turn an illustration into a print-ready paper miniature (SVG + PDF sheet)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.22",
    "pillow>=9.0",
    "opencv-python-headless>=4.6",
    "onnxruntime>=1.14",
    "reportlab>=3.6",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.10"]  # standalone binaries, see packaging/

[project.scripts]
papermini = "papermini.cli:main"

[project.gui-scripts]
papermini-gui = "papermini.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papermini.gui" = ["logo.svg"]

[tool.setuptools_scm]
# Semantic versioning from git tags: tag v1.2.3 builds version 1.2.3; commits after
# a tag get a development version such as 1.2.4.dev3+g1a2b3c4.
version_file = "src/papermini/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
