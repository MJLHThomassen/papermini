# Builds standalone binaries for Windows, macOS and Linux.
#
# - Run it by hand on main (Actions > Release > Run workflow) with a version
#   (MAJOR.MINOR.PATCH, e.g. 1.2.0, or 1.2.0-rc.1 for a pre-release), or push a
#   version tag (v1.2.0): tests run, binaries are built, and a GitHub release is
#   created with the archives, the Windows installer (Inno Setup,
#   packaging/papermini.iss), their SHA-256 checksums, and notes listing every
#   commit since the previous version tag (scripts/release_notes.py). A run by hand
#   tags the commit it ran on (v1.2.0) just before it creates the release. A pushed
#   tag must be on main and newer than the latest version tag, like a version
#   entered by hand.
# - Run it by hand without a version to build the binaries as workflow artifacts
#   without making a release. On main, such a run also writes the release notes,
#   the checksums and their signature, so it tests every step but tagging and
#   publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. 1.2.0 or 1.2.0-rc.1 (tags the latest commit on
          main as v1.2.0). Leave empty to only build the binaries.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      tag: ${{ steps.tag.outputs.tag }}          # v1.2.0
      version: ${{ steps.tag.outputs.version }}  # 1.2.0
      new: ${{ steps.tag.outputs.new }}          # true: the release job makes the tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the existing version tags

      - id: tag
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME" new=false
          elif [[ -n "${INPUT// /}" ]]; then
            input="${INPUT// /}"
            tag="v${input#v}" new=true
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Manual run without a version: building binaries only, no release."
            exit 0
          fi
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "$tag" =~ $semver ]] ||
            fail "'$tag' is not a semantic version (MAJOR.MINOR.PATCH[-PRERELEASE])"
          pre="${BASH_REMATCH[4]}"
          core="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [[ "$new" == true ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] ||
              fail "Run the release on main (this run is on $GITHUB_REF_NAME)"
            ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null ||
              fail "$tag exists already: pick a new version"
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              fail "$tag is not on main: tag a commit on main"
          fi
          # newer than the latest other version tag (a release may follow its own
          # pre-release)
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname |
                   grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' |
                   grep -vxF "$tag" | head -n 1 || true)
          if [[ -n "$latest" ]]; then
            lcore="${latest#v}"; lcore="${lcore%%-*}"
            newest=$(printf '%s\n%s\n' "$core" "$lcore" | sort -V | tail -n 1)
            if [[ "$core" == "$lcore" ]]; then
              [[ "$latest" == *-* ]] || fail "$tag is not newer than $latest"
            elif [[ "$newest" != "$core" ]]; then
              fail "$tag is not newer than $latest"
            fi
          fi
          if [[ "$new" == true ]]; then
            echo "Releasing $tag from $GITHUB_SHA (tagged just before the release is created)"
          else
            echo "Releasing $tag from $GITHUB_SHA"
          fi
          {
            echo "release=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "new=$new"
            echo "prerelease=$([[ -n "$pre" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write  # (CI pushes its Linux image when the Dockerfile changed)

  build:
    name: Build (${{ matrix.target }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    # builds take 1-5 minutes; Windows also builds the installer, which takes longer
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025  # has Inno Setup, for the installer
            target: windows-x64
            timeout: 15
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distributions
            target: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install
        shell: bash
        env:
          NEW_VERSION: ${{ needs.version.outputs.new == 'true' && needs.version.outputs.version || '' }}
        run: |
          # a release run by hand is not tagged yet: give setuptools-scm its version
          if [[ -n "$NEW_VERSION" ]]; then export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"; fi
          uv sync --locked --extra gui --group build --no-dev --no-editable

      - name: Version
        id: ver
        shell: bash
        run: |
          version=$(uv run --no-sync python -c "import papermini; print(papermini.__version__)")
          echo "Building papermini $version"
          if [[ "${{ needs.version.outputs.release }}" == "true" && "$version" == *dev* ]]; then
            echo "::error::Release build got a development version ($version)"
            exit 1
          fi
          # archive names use the release's semantic version; other runs the dev version
          name="${{ needs.version.outputs.version }}"
          if [[ "${{ needs.version.outputs.release }}" != "true" ]]; then name="$version"; fi
          echo "name=${name//+/-}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv run --no-sync pyinstaller packaging/papermini.spec --noconfirm

      - name: Smoke test
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          case "$RUNNER_OS" in
            Windows) cli=dist/papermini/papermini.exe ;;
            macOS)   cli=dist/papermini.app/Contents/MacOS/papermini ;;
            *)       cli=dist/papermini/papermini ;;
          esac
          got=$("$cli" --version)
          [[ "$got" == "papermini $VERSION" ]] ||
            { echo "::error::$cli --version says '$got', expected 'papermini $VERSION'"; exit 1; }
          # make a mini from a cut-out figure and put it on a sheet: this loads the
          # writers and the bundled fonts, which a missing file would break
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          uv run --no-sync python -c "
          import sys
          from PIL import Image, ImageDraw
          im = Image.new('RGBA', (200, 300), (0, 0, 0, 0))
          ImageDraw.Draw(im).ellipse((20, 20, 180, 280), fill=(200, 60, 40, 255))
          im.save(sys.argv[1])
          " "$smoke/fig.png"
          "$cli" make "$smoke/fig.png" --model alpha --format both -o "$smoke/out"
          ls -l "$smoke/out"
          "$cli" sheet "$smoke"/out/*.svg -o "$smoke/sheet.pdf"
          for f in "$smoke"/out/*.png "$smoke/sheet.pdf"; do
            [[ -s "$f" ]] || { echo "::error::the smoke test made no $(basename "$f")"; exit 1; }
          done
          if [[ "$RUNNER_OS" == macOS ]]; then  # a regular app: it shows in the Dock
            plist=dist/papermini.app/Contents/Info.plist
            bg=$(plutil -extract LSBackgroundOnly raw "$plist" 2>/dev/null || echo false)
            [[ "$bg" == false ]] || { echo "::error::$plist: LSBackgroundOnly is $bg"; exit 1; }
          fi

      - name: Package
        id: pkg
        shell: bash
        env:
          NAME: ${{ steps.ver.outputs.name }}
          TARGET: ${{ matrix.target }}
        run: |
          # the name installed copies look for when they update
          archive=$(uv run --no-sync python -c \
            "import sys; from papermini import update; print(update.asset_name(*sys.argv[1:]))" \
            "$NAME" "$TARGET")
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip -mx=9 "../out/$archive" papermini > /dev/null) ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent dist/papermini.app "out/$archive" ;;
            *)       tar -C dist -czf "out/$archive" papermini ;;
          esac
          ls -l out

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run --no-sync python scripts/build_installer.py --version "${{ steps.ver.outputs.name }}" \
            --dist dist/papermini --out out
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: papermini-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: [version, build]
    # a build-only run on main also tests the notes, checksums and signing; other
    # branches never get the signing key
    if: needs.version.outputs.release == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the notes list every commit since the previous version tag

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag || 'HEAD' }}  # (HEAD: the notes so far)
        run: |
          uv run --locked --only-group release python scripts/release_notes.py "$TAG" \
            --repo "$GITHUB_REPOSITORY" -o "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Sign the checksums (the app's updates check this signature)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          uv run --locked --only-group release python scripts/sign_release.py out/SHA256SUMS.txt

      - name: Tag (a release run by hand)
        if: needs.version.outputs.new == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "papermini ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"
