# Builds standalone binaries for Windows, macOS and Linux.
#
# - Push a version tag (vMAJOR.MINOR.PATCH, e.g. v1.2.0, or v1.2.0-rc.1 for a
#   pre-release): tests run, binaries are built, and a GitHub release is created
#   with the archives, their SHA-256 checksums, and notes listing every commit
#   since the previous version tag (scripts/release_notes.py).
# - Run it by hand (Actions > Release > Run workflow) to build the binaries as
#   workflow artifacts without making a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: building binaries only, no release."
            exit 0
          fi
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # builds take 1-5 minutes (Windows is slowest)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distributions
            target: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install
        run: python -m pip install ".[gui,build]"

      - name: Version
        id: ver
        shell: bash
        run: |
          version=$(python -c "import papermini; print(papermini.__version__)")
          echo "Building papermini $version"
          if [[ "${{ needs.version.outputs.release }}" == "true" && "$version" == *dev* ]]; then
            echo "::error::Tagged build got a development version ($version)"
            exit 1
          fi
          # archive names use the tag's semantic version; manual runs use the dev version
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then name="${GITHUB_REF_NAME#v}"; else name="$version"; fi
          echo "name=${name//+/-}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pyinstaller packaging/papermini.spec --noconfirm

      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cli=dist/papermini/papermini.exe ;;
            macOS)   cli=dist/papermini.app/Contents/MacOS/papermini ;;
            *)       cli=dist/papermini/papermini ;;
          esac
          "$cli" --version
          "$cli" make --help > /dev/null
          if [[ "$RUNNER_OS" == macOS ]]; then  # a regular app: it shows in the Dock
            plist=dist/papermini.app/Contents/Info.plist
            bg=$(plutil -extract LSBackgroundOnly raw "$plist" 2>/dev/null || echo false)
            [[ "$bg" == false ]] || { echo "::error::$plist: LSBackgroundOnly is $bg"; exit 1; }
          fi

      - name: Package
        id: pkg
        shell: bash
        run: |
          base="papermini-${{ steps.ver.outputs.name }}-${{ matrix.target }}"
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip -mx=9 "../out/$base.zip" papermini > /dev/null) ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent dist/papermini.app "out/$base.zip" ;;
            *)       tar -C dist -czf "out/$base.tar.gz" papermini ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: papermini-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the notes list every commit since the previous version tag

      - name: Release notes
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -o "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Sign the checksums (the app's updates check this signature)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python3 -m pip install --quiet "cryptography>=42"
          python3 scripts/sign_release.py out/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "papermini ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"
