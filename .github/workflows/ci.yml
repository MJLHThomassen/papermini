# Tests on every push to main and every pull request. The release workflow reuses
# this file (workflow_call) so a release is only built from a commit that passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # a hung test fails the job instead of running for 6 hours
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Test
        run: uv run --no-sync python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Ruff check
        run: uv run --locked --only-group dev ruff check --output-format github

      - name: Ruff format
        run: uv run --locked --only-group dev ruff format --diff

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: ty
        continue-on-error: true  # ty is in beta, and the code doesn't pass it yet
        run: uv run --no-sync ty check --output-format github

  # The Linux tests run in papermini's CI image (.github/ci-image): Python and Qt's
  # system libraries, ready made, instead of downloading them from the Ubuntu mirror
  # every run. The image is tagged with a hash of its Dockerfile and built only when
  # that version has no image on ghcr.io yet.
  image:
    name: CI image (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # (a new image takes about a minute; an existing one seconds)
    permissions:
      contents: read
      packages: write  # push a new image (pull requests from forks only read)
    outputs:
      image: ${{ steps.ref.outputs.image }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: ref
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/papermini-ci" >> "$GITHUB_OUTPUT"
          echo "tag=$(sha256sum .github/ci-image/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push the images this Dockerfile has not got yet
        shell: bash
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for py in 3.10 3.12; do
            ref="$IMAGE:py$py-$TAG"
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "$ref exists"
            else
              docker build --build-arg "PYTHON=$py" -t "$ref" .github/ci-image
              docker push "$ref"
            fi
          done

  test-linux:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: image
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # (diagnostic, temporary)
    container:
      image: ${{ needs.image.outputs.image }}:py${{ matrix.python }}-${{ needs.image.outputs.tag }}
      credentials:  # (the image may still be private)
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: true
          - os: ubuntu-22.04
            python: "3.10"  # the oldest version pyproject.toml promises
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}  # the image's Python
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Test
        if: matrix.python != '3.10'
        run: uv run --no-sync python -m pytest -q ${{ matrix.coverage && '--cov' || '' }}
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test variants (diagnostic, temporary)
        if: matrix.python == '3.10'
        timeout-minutes: 40
        run: |
          set +e
          variant() {
            echo "=== $1"
            uv run --no-sync python -m pytest -q -p no:cacheprovider $2 > /tmp/o 2>&1
            echo "=== $1: exit $?"
            tail -3 /tmp/o
          }
          git config --global --add safe.directory "$PWD"
          f=tests/gui/test_option_fields.py
          variant "$f, try 2" "$f"
          variant "test_every_figure_setting_has_a_field_or_is_listed" "$f::test_every_figure_setting_has_a_field_or_is_listed"
          variant "test_each_figure_setting_has_its_panel_field" "$f::test_each_figure_setting_has_its_panel_field"
          variant "test_each_figure_field_shows_its_setting" "$f::test_each_figure_field_shows_its_setting"
          variant "test_each_figure_field_edits_its_setting" "$f::test_each_figure_field_edits_its_setting"
          variant "test_each_figure_field_has_a_tooltip" "$f::test_each_figure_field_has_a_tooltip"
          variant "test_a_tokens_label_field_edits_the_label" "$f::test_a_tokens_label_field_edits_the_label"
          variant "test_every_sheet_setting_has_a_field_or_is_listed" "$f::test_every_sheet_setting_has_a_field_or_is_listed"
          variant "test_each_sheet_field_shows_its_setting" "$f::test_each_sheet_field_shows_its_setting"
          variant "test_each_sheet_field_edits_its_setting" "$f::test_each_sheet_field_edits_its_setting"
          variant "test_each_sheet_field_has_a_tooltip" "$f::test_each_sheet_field_has_a_tooltip"
          variant "$f, try 3" "$f"
          exit 0
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Coverage report
        if: matrix.coverage
        run: uv run --no-sync coverage report --format markdown >> "$GITHUB_STEP_SUMMARY"
