# Tests on every push to main and every pull request. The release workflow reuses
# this file (workflow_call) so a release is only built from a commit that passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5  # runs take 1-3 minutes; a hung test fails fast, not after 6 hours
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # The Linux tests run in papermini's CI image (.github/ci-image): Python and Qt's
  # system libraries, ready made, instead of downloading them from the Ubuntu mirror
  # every run. The image is tagged with a hash of its Dockerfile and built only when
  # that version has no image on ghcr.io yet.
  image:
    name: CI image (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # (a new image takes about a minute; an existing one seconds)
    permissions:
      contents: read
      packages: write  # push a new image (pull requests from forks only read)
    outputs:
      image: ${{ steps.ref.outputs.image }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: ref
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/papermini-ci" >> "$GITHUB_OUTPUT"
          echo "tag=$(sha256sum .github/ci-image/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push the images this Dockerfile has not got yet
        shell: bash
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for py in 3.10 3.12; do
            ref="$IMAGE:py$py-$TAG"
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "$ref exists"
            else
              docker build --build-arg "PYTHON=$py" -t "$ref" .github/ci-image
              docker push "$ref"
            fi
          done

  test-linux:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: image
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5  # runs take 1-3 minutes; a hung test fails fast, not after 6 hours
    container:
      image: ${{ needs.image.outputs.image }}:py${{ matrix.python }}-${{ needs.image.outputs.tag }}
      credentials:  # (the image may still be private)
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-22.04
            python: "3.10"  # the oldest version pyproject.toml promises
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-linux-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-linux-py${{ matrix.python }}-

      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
