# Tests on every push to main and every pull request. The release workflow reuses
# this file (workflow_call) so a release is only built from a commit that passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The steps run the justfile's recipes, as a developer does (rule R1 of the guide).
env:
  JUST_VERSION: "1.59.0"  # the just release that runs the recipes
  UV_LOCKED: "1"  # uv fails when uv.lock is out of date, instead of updating it
  UV_PROJECT_ENVIRONMENT: .venv  # in the checkout, not the justfile's default

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tested Python versions are the lines of .python-version. uv picks the first
  # one when nothing else names a version, so the types job and the release builds
  # use it, and the Linux job for it reports the coverage.
  python:
    name: Python versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}  # a JSON list
      first: ${{ steps.read.outputs.first }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .python-version
          sparse-checkout-cone-mode: false

      - id: read
        shell: bash
        run: |
          versions=$(sed 's/#.*//' .python-version | tr -d ' \t\r' | grep . | jq -R . | jq -sc .)
          [[ "$versions" != "[]" ]] || { echo "::error::.python-version names no Python"; exit 1; }
          echo "Tested Pythons: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "first=$(jq -r '.[0]' <<< "$versions")" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # a hung test fails the job instead of running for 6 hours
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]  # the release's Intel Mac runner
        python: ${{ fromJSON(needs.python.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python }}
          enable-cache: true

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install
        run: just setup

      - name: Test
        run: just test -q
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Ruff check
        run: just lint --output-format github

      - name: Ruff format
        run: just format --diff

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install
        run: just setup

      # The code doesn't pass ty yet. TY_FINDINGS is the number of findings ty reports
      # on main; the step fails when ty reports more. See rule R2 of the guide.
      - name: ty
        shell: bash  # with pipefail, so that a ty crash fails the step
        env:
          TY_FINDINGS: 570
        run: |
          just typecheck --exit-zero --output-format github | tee "$RUNNER_TEMP/ty.txt"
          found=$(grep -c '^::' "$RUNNER_TEMP/ty.txt" || true)
          echo "ty reports $found findings. The limit (TY_FINDINGS) is $TY_FINDINGS." >> "$GITHUB_STEP_SUMMARY"
          if [ "$found" -gt "$TY_FINDINGS" ]; then
            echo "::error title=ty::ty reports $found findings, more than the $TY_FINDINGS on main. Fix the new ones."
            exit 1
          elif [ "$found" -lt "$TY_FINDINGS" ]; then
            echo "::notice title=ty::ty reports $found findings, fewer than the $TY_FINDINGS on main. Lower TY_FINDINGS to $found."
          fi

  # The Linux tests run in papermini's CI image (.github/ci-image): Python and Qt's
  # system libraries, ready made, instead of downloading them from the Ubuntu mirror
  # every run. There is one image for each tested Python, tagged with a hash of the
  # Dockerfile and built only when that version has no image on ghcr.io yet.
  image:
    name: CI image (Linux, Python ${{ matrix.python }})
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 10  # (a new image takes about a minute; an existing one seconds)
    permissions:
      contents: read
      packages: write  # push a new image (pull requests from forks only read)
    strategy:
      matrix:
        python: ${{ fromJSON(needs.python.outputs.versions) }}
    outputs:  # (the same for every Python)
      image: ${{ steps.ref.outputs.image }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: ref
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/papermini-ci" >> "$GITHUB_OUTPUT"
          echo "tag=$(sha256sum .github/ci-image/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push the image if this Dockerfile has not got one yet
        shell: bash
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          PYTHON: ${{ matrix.python }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="$IMAGE:py$PYTHON-$TAG"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "$ref exists"
          else
            docker build --build-arg "PYTHON=$PYTHON" -t "$ref" .github/ci-image
            docker push "$ref"
          fi

  test-linux:
    name: Test (ubuntu-latest, Python ${{ matrix.python }})
    needs: [python, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a hung test fails the job instead of running for 6 hours
    container:
      image: ${{ needs.image.outputs.image }}:py${{ matrix.python }}-${{ needs.image.outputs.tag }}
      credentials:  # (the image may still be private)
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.python.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python }}  # the image's Python
          enable-cache: true

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install
        run: just setup

      - name: Test
        if: matrix.python != needs.python.outputs.first
        run: just test -q
        env:
          QT_QPA_PLATFORM: offscreen

      # the coverage report goes to the log and, as a table, to the job summary
      - name: Test with coverage
        if: matrix.python == needs.python.outputs.first
        run: >-
          just coverage -q --cov-report=term
          "--cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
        env:
          QT_QPA_PLATFORM: offscreen
