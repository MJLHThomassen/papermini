# Tests on every push to main and every pull request. The release workflow reuses
# this file (workflow_call) so a release is only built from a commit that passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"  # the oldest version pyproject.toml promises
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
